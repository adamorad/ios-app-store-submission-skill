name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository structure
        run: python3 scripts/validate_repo.py
      - name: Check shell syntax
        run: bash -n scripts/*.sh
      - name: Check whitespace
        run: git diff --check
